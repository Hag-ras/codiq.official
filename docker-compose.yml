services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: codiq
      POSTGRES_PASSWORD: codiq
      POSTGRES_DB: codiq
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  # S3-compatible local storage (MinIO's public image is no longer available). Console: http://localhost:9001
  rustfs:
    image: rustfs/rustfs:latest
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: codiq
      RUSTFS_SECRET_KEY: codiq-secret
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
    ports: ["9000:9000", "9001:9001"]
    volumes: [rustfsdata:/data]

  storage-init:
    image: public.ecr.aws/aws-cli/aws-cli:latest
    depends_on: [rustfs]
    environment:
      AWS_ACCESS_KEY_ID: codiq
      AWS_SECRET_ACCESS_KEY: codiq-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until aws --endpoint-url http://rustfs:9000 s3api list-buckets; do sleep 2; done;
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket codiq || true

  livekit:
    image: livekit/livekit-server
    command: --dev --bind 0.0.0.0
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]

volumes:
  pgdata:
  rustfsdata:
