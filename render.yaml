# Render blueprint for the API. The web app goes on Vercel (see docs/DEPLOY.md).
services:
  - type: web
    name: codiq-api
    runtime: node
    region: frankfurt
    rootDir: backend
    # Not free: a free service sleeps after 15 minutes, which kills the support chat, the scheduled emails and webhook retries
    plan: starter
    buildCommand: npm ci && npx prisma generate && npm run build
    # Applies new database migrations before each deploy (safe to run every time: it only applies what is missing)
    preDeployCommand: npx prisma migrate deploy
    startCommand: node dist/main
    healthCheckPath: /api/packages
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: NODE_VERSION, value: "22" }
      # Set the rest in the Render dashboard (marked sync: false so they are never stored in git)
      - { key: DATABASE_URL, sync: false }
      - { key: DIRECT_URL, sync: false }
      - { key: FRONTEND_URL, sync: false }
      - { key: API_PUBLIC_URL, sync: false }
      - { key: JWT_ACCESS_SECRET, sync: false }
      - { key: JWT_REFRESH_SECRET, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: RESEND_API_KEY, sync: false }
      - { key: MAIL_FROM, sync: false }
      - { key: PAYMOB_SECRET_KEY, sync: false }
      - { key: PAYMOB_PUBLIC_KEY, sync: false }
      - { key: PAYMOB_HMAC_SECRET, sync: false }
      - { key: PAYMOB_CARD_INTEGRATION_ID, sync: false }
      - { key: PAYMOB_WALLET_INTEGRATION_ID, sync: false }
      - { key: PAYMOB_INSTALLMENT_INTEGRATION_IDS, sync: false }
      - { key: FAWRY_BASE_URL, sync: false }
      - { key: FAWRY_MERCHANT_CODE, sync: false }
      - { key: FAWRY_SECURE_KEY, sync: false }
      - { key: INSTAPAY_ADDRESS, sync: false }
      - { key: JOBS_ENABLED, value: "true" }
      - { key: S3_ENDPOINT, sync: false }
      - { key: S3_REGION, value: auto }
      - { key: S3_BUCKET, value: codiq }
      - { key: S3_ACCESS_KEY, sync: false }
      - { key: S3_SECRET_KEY, sync: false }
      - { key: LIVEKIT_URL, sync: false }
      - { key: LIVEKIT_HTTP_URL, sync: false }
      - { key: LIVEKIT_API_KEY, sync: false }
      - { key: LIVEKIT_API_SECRET, sync: false }
